[package]
name = "shredstream"
version = "2.0.0"
rust-version = "1.75"
edition = "2021"
description = "Solana ShredStream SDK/Decoder for Rust, enabling ultra-low latency Solana transaction streaming via UDP shreds from https://www.shredstream.com"
license = "MIT"
authors = ["ShredStream.com"]
readme = "README.md"
repository = "https://github.com/shredstream/shredstream-sdk-rust"
homepage = "https://shredstream.com"
keywords = ["solana", "shredstream", "mev", "hft", "defi"]
categories = ["network-programming", "cryptography::cryptocurrencies"]
exclude = ["assets/", "tools/", "tests/"]

[dependencies]
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
solana-entry = { version = "~3.1.10", features = ["agave-unstable-api"] }
solana-transaction = "3.0"
socket2 = { version = "0.5", features = ["all"] }
rustc-hash = "2"
libc = "0.2"

[target.'cfg(target_arch = "x86_64")'.dependencies]
reed-solomon-erasure = { version = "6", features = ["simd-accel"] }

[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
reed-solomon-erasure = "6"

[[example]]
name = "listen"
path = "examples/listen.rs"

[[example]]
name = "pumpfun_creates"
path = "examples/pumpfun_creates.rs"

[dev-dependencies]
solana-pubkey = "3.0"
